name: Sync Leetcode

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 6"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Sync
        id: sync
        continue-on-error: true
        uses: joshcai/leetcode-sync@v1.7
        with:
          github-token: ${{ github.token }}
          leetcode-csrf-token: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          leetcode-session: ${{ secrets.LEETCODE_SESSION }}
          verbose: true
          commit-header: "[LeetCode Sync]"

      - name: Warn when sync fails
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::warning title=LeetCode sync failed::The sync step failed. This usually means LEETCODE_SESSION or LEETCODE_CSRF_TOKEN has expired and needs to be refreshed in repository secrets."

      - name: Fail manual runs if sync fails
        if: steps.sync.outcome == 'failure' && github.event_name == 'workflow_dispatch'
        run: exit 1
